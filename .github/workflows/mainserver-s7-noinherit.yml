name: Mainserver S7 NOINHERIT followup
on:
  pull_request:
    paths:
      - scripts/tu1nz_mainserver_s7_noinherit.py
      - scripts/tu1nz_mainserver_s7_noinherit_file_restore.py
      - tests/test_mainserver_s7_noinherit.py
      - .github/workflows/mainserver-s7-noinherit.yml
permissions:
  contents: read
jobs:
  s7-noinherit-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Synthetic boundaries, no Host, backup contents or credentials
        run: sudo env PYTHONPATH="$PWD" python3 -B -m unittest -v tests.test_mainserver_s7_noinherit

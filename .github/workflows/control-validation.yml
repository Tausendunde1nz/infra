name: Control validation

on:
  pull_request:
  push:
    branches: [control-main]

permissions:
  contents: read

jobs:
  restore-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Python verifier
        run: python3 -m py_compile scripts/tu1nz_adult_restore_verify.py tests/test_adult_restore_verify.py
      - name: Check shell wrapper
        run: bash -n scripts/tu1nz_adult_restore_verify.sh
      - name: Run restore contract tests
        run: python3 -m unittest -v tests.test_adult_restore_verify
      - name: Validate release schema JSON
        run: python3 -m json.tool manifests/adult-publishing-staging-release.schema.json >/dev/null
      - name: Reject cron behavior in M3.5.1 artifacts
        run: >-
          ! git grep -nE '(^|[[:space:]])crontab([[:space:]]|$)' --
          scripts/tu1nz_adult_restore_verify.py
          scripts/tu1nz_adult_restore_verify.sh
          systemd/tu1nz-adult-restore-verify.service
      - name: Compile M3.5.2 deployment-readiness artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_staging_manifest.py
          scripts/tu1nz_adult_s0_release_gate.py
          tests/test_adult_s0_deployment_readiness.py
      - name: Run M3.5.2 deployment-readiness tests
        run: python3 -m unittest -v tests.test_adult_s0_deployment_readiness
      - name: Reject activation, networking and cron in M3.5.2 artifacts
        run: >-
          ! git grep -nEi
          '(WantedBy=|Listen(Stream|Datagram)=|https?://|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_staging_manifest.py
          scripts/tu1nz_adult_s0_release_gate.py
          systemd/tu1nz-adult-s0-release-verify.service
      - name: Validate M4.18 commercial readiness JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-readiness.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-readiness.m4-18.json >/dev/null
      - name: Compile M4.18 commercial readiness artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_readiness_gate.py
          tests/test_adult_commercial_readiness.py
      - name: Run M4.18 commercial readiness tests
        run: python3 -m unittest -v tests.test_adult_commercial_readiness
      - name: Reject server mutation and activation behavior in M4.18 gate
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]+(run|start|stop|restart)|(^|[[:space:]])crontab([[:space:]]|$)|subprocess\.(run|Popen).*\b(rm|mv|cp|install|chmod|chown)\b)' --
          scripts/tu1nz_adult_commercial_readiness_gate.py
      - name: Validate M4.19 commercial S0 release schema JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-s0-release.schema.json >/dev/null
      - name: Compile M4.19 commercial S0 installation artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_s0_manifest.py
          scripts/tu1nz_adult_commercial_s0_release_gate.py
          tests/test_adult_commercial_s0_installation_design.py
      - name: Run M4.19 commercial S0 installation tests
        run: python3 -m unittest -v tests.test_adult_commercial_s0_installation_design
      - name: Validate M4.19 backup shell
        run: bash -n scripts/tu1nz_encrypted_backup.sh
      - name: Reject activation, IP networking, cron and provider credentials in M4.19 runtime artifacts
        run: >-
          ! git grep -nEi
          '(WantedBy=|network-online\.target|AF_INET|https?://|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_s0_manifest.py
          scripts/tu1nz_adult_commercial_s0_release_gate.py
          systemd/tu1nz-adult-commercial-s0.service
          config/adult-publishing/staging-s0-commercial/runtime.env.example
      - name: Reject server mutation behavior in M4.19 release tools
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]+(run|start|stop|restart)|subprocess\.(run|Popen).*\b(rm|mv|cp|install|chmod|chown)\b)' --
          scripts/tu1nz_adult_commercial_s0_manifest.py
          scripts/tu1nz_adult_commercial_s0_release_gate.py
      - name: Validate M4.20 commercial installation preflight JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-installation-preflight.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-installation-preflight.m4-20.json >/dev/null
      - name: Compile M4.20 commercial installation preflight artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_installation_preflight_gate.py
          tests/test_adult_commercial_installation_preflight.py
      - name: Run M4.20 commercial installation preflight tests
        run: python3 -m unittest -v tests.test_adult_commercial_installation_preflight
      - name: Reject server mutation behavior in M4.20 preflight gate
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]+(run|start|stop|restart)|ssh[[:space:]]|tailscale[[:space:]]|subprocess|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_installation_preflight_gate.py
      - name: Validate M4.21 commercial host-access JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-host-access.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-host-access.m4-21.json >/dev/null
      - name: Compile M4.21 commercial host-access artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_host_access_gate.py
          tests/test_adult_commercial_host_access_design.py
      - name: Validate M4.21 ACL shell
        run: bash -n scripts/tu1nz_adult_commercial_path_access.sh
      - name: Run M4.21 commercial host-access tests
        run: python3 -m unittest -v tests.test_adult_commercial_host_access_design
      - name: Reject broad ACL, activation, cron and provider credentials in M4.21 operational artifacts
        run: >-
          ! git grep -nEi
          '(setfacl[[:space:]]+(-R|--recursive)|systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]|WantedBy=|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN|[[:space:]]trust([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_path_access.sh
          config/postgresql/adult-publishing-commercial-s0.pg_hba.rule
          config/postgresql/adult-publishing-commercial-s0.pg_ident.map
      - name: Validate M4.22 commercial installation authorization JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-installation-authorization.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-installation-authorization.m4-22.json >/dev/null
      - name: Compile M4.22 commercial installation authorization artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_installation_authorization_gate.py
          tests/test_adult_commercial_installation_authorization.py
      - name: Run M4.22 commercial installation authorization tests
        run: python3 -m unittest -v tests.test_adult_commercial_installation_authorization
      - name: Reject mutation and network behavior in M4.22 authorization gate
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]|ssh[[:space:]]|tailscale[[:space:]]|subprocess|https?://|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_installation_authorization_gate.py
      - name: Validate M4.23 stopped installation shell
        run: bash -n scripts/tu1nz_adult_commercial_s0_install.sh
      - name: Compile M4.23 stopped installation tests
        run: python3 -m py_compile tests/test_adult_commercial_s0_stopped_installation.py
      - name: Run M4.23 stopped installation tests
        run: python3 -m unittest -v tests.test_adult_commercial_s0_stopped_installation
      - name: Reject first start, enablement, cron and provider credentials in M4.23
        run: >-
          ! git grep -nEi
          '(systemctl[[:space:]]+(start|restart|enable)[[:space:]]+.*commercial|WantedBy=|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_s0_install.sh
          config/adult-publishing/staging-s0-commercial/bootstrap.sql
          config/adult-publishing/staging-s0-commercial/core-identities.synthetic.json
          config/adult-publishing/staging-s0-commercial/state.empty.json
      - name: Validate M4.24 network-free first-start JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-first-start.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-first-start.m4-24.json >/dev/null
      - name: Compile M4.24 first-start artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_first_start_gate.py
          scripts/tu1nz_adult_commercial_s0_first_start.py
          tests/test_adult_commercial_first_start.py
      - name: Run M4.24 first-start tests
        run: python3 -m unittest -v tests.test_adult_commercial_first_start
      - name: Require committed M4.24 contract to remain NO-GO
        run: >-
          scripts/tu1nz_adult_commercial_first_start_gate.py
          --contract manifests/adult-publishing-commercial-first-start.m4-24.json
          && ! scripts/tu1nz_adult_commercial_first_start_gate.py
          --contract manifests/adult-publishing-commercial-first-start.m4-24.json
          --require-approved
      - name: Reject enablement, restart, deletion, networking and provider credentials in M4.24
        shell: bash
        run: |
          if git grep -nEi \
            '(SYSTEMCTL,[[:space:]]*"(enable|restart)"|rm[[:space:]]+-rf|shutil\.rmtree|docker[[:space:]]+run|https?://api\.|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN|(^|[[:space:]])crontab([[:space:]]|$))' -- \
            scripts/tu1nz_adult_commercial_first_start_gate.py \
            scripts/tu1nz_adult_commercial_s0_first_start.py
          then
            echo "Forbidden M4.24 behavior detected" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "M4.24 static guard infrastructure failed" >&2
              exit "$status"
            fi
          fi
      - name: Compile M3.9 persistent S1 artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_s1_manifest.py
          scripts/tu1nz_adult_s1_release_gate.py
          tests/test_adult_s1_runtime.py
      - name: Run M3.9 persistent S1 contract tests
        run: python3 -m unittest -v tests.test_adult_s1_runtime
      - name: Validate M3.9 release schema JSON
        run: python3 -m json.tool manifests/adult-publishing-staging-s1-release.schema.json >/dev/null
      - name: Validate M3.9 backup shell
        run: bash -n scripts/tu1nz_encrypted_backup.sh
      - name: Reject cron and live-provider credentials in M3.9 artifacts
        run: >-
          ! git grep -nEi
          '((^|[[:space:]])crontab([[:space:]]|$)|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_s1_manifest.py
          scripts/tu1nz_adult_s1_release_gate.py
          scripts/tu1nz_encrypted_backup.sh
          systemd/tu1nz-adult-publishing-s1.service
          config/adult-publishing/staging-s1/runtime.env.example

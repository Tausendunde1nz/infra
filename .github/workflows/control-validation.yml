name: Control validation

on:
  pull_request:
  push:
    branches: [control-main]

permissions:
  contents: read

jobs:
  restore-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Python verifier
        run: python3 -m py_compile scripts/tu1nz_adult_restore_verify.py tests/test_adult_restore_verify.py
      - name: Check shell wrapper
        run: bash -n scripts/tu1nz_adult_restore_verify.sh
      - name: Run restore contract tests
        run: python3 -m unittest -v tests.test_adult_restore_verify
      - name: Validate release schema JSON
        run: python3 -m json.tool manifests/adult-publishing-staging-release.schema.json >/dev/null
      - name: Reject cron behavior in M3.5.1 artifacts
        run: >-
          ! git grep -nE '(^|[[:space:]])crontab([[:space:]]|$)' --
          scripts/tu1nz_adult_restore_verify.py
          scripts/tu1nz_adult_restore_verify.sh
          systemd/tu1nz-adult-restore-verify.service
      - name: Compile M3.5.2 deployment-readiness artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_staging_manifest.py
          scripts/tu1nz_adult_s0_release_gate.py
          tests/test_adult_s0_deployment_readiness.py
      - name: Run M3.5.2 deployment-readiness tests
        run: python3 -m unittest -v tests.test_adult_s0_deployment_readiness
      - name: Reject activation, networking and cron in M3.5.2 artifacts
        run: >-
          ! git grep -nEi
          '(WantedBy=|Listen(Stream|Datagram)=|https?://|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_staging_manifest.py
          scripts/tu1nz_adult_s0_release_gate.py
          systemd/tu1nz-adult-s0-release-verify.service
      - name: Validate M4.18 commercial readiness JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-readiness.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-readiness.m4-18.json >/dev/null
      - name: Compile M4.18 commercial readiness artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_readiness_gate.py
          tests/test_adult_commercial_readiness.py
      - name: Run M4.18 commercial readiness tests
        run: python3 -m unittest -v tests.test_adult_commercial_readiness
      - name: Reject server mutation and activation behavior in M4.18 gate
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]+(run|start|stop|restart)|(^|[[:space:]])crontab([[:space:]]|$)|subprocess\.(run|Popen).*\b(rm|mv|cp|install|chmod|chown)\b)' --
          scripts/tu1nz_adult_commercial_readiness_gate.py
      - name: Validate M4.19 commercial S0 release schema JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-s0-release.schema.json >/dev/null
      - name: Compile M4.19 commercial S0 installation artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_s0_manifest.py
          scripts/tu1nz_adult_commercial_s0_release_gate.py
          tests/test_adult_commercial_s0_installation_design.py
      - name: Run M4.19 commercial S0 installation tests
        run: python3 -m unittest -v tests.test_adult_commercial_s0_installation_design
      - name: Validate M4.19 backup shell
        run: bash -n scripts/tu1nz_encrypted_backup.sh
      - name: Reject activation, IP networking, cron and provider credentials in M4.19 runtime artifacts
        run: >-
          ! git grep -nEi
          '(WantedBy=|network-online\.target|AF_INET|https?://|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_s0_manifest.py
          scripts/tu1nz_adult_commercial_s0_release_gate.py
          systemd/tu1nz-adult-commercial-s0.service
          config/adult-publishing/staging-s0-commercial/runtime.env.example
      - name: Reject server mutation behavior in M4.19 release tools
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]+(run|start|stop|restart)|subprocess\.(run|Popen).*\b(rm|mv|cp|install|chmod|chown)\b)' --
          scripts/tu1nz_adult_commercial_s0_manifest.py
          scripts/tu1nz_adult_commercial_s0_release_gate.py
      - name: Validate M4.20 commercial installation preflight JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-installation-preflight.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-installation-preflight.m4-20.json >/dev/null
      - name: Compile M4.20 commercial installation preflight artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_installation_preflight_gate.py
          tests/test_adult_commercial_installation_preflight.py
      - name: Run M4.20 commercial installation preflight tests
        run: python3 -m unittest -v tests.test_adult_commercial_installation_preflight
      - name: Reject server mutation behavior in M4.20 preflight gate
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]+(run|start|stop|restart)|ssh[[:space:]]|tailscale[[:space:]]|subprocess|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_installation_preflight_gate.py
      - name: Validate M4.21 commercial host-access JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-host-access.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-host-access.m4-21.json >/dev/null
      - name: Compile M4.21 commercial host-access artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_host_access_gate.py
          tests/test_adult_commercial_host_access_design.py
      - name: Validate M4.21 ACL shell
        run: bash -n scripts/tu1nz_adult_commercial_path_access.sh
      - name: Run M4.21 commercial host-access tests
        run: python3 -m unittest -v tests.test_adult_commercial_host_access_design
      - name: Reject broad ACL, activation, cron and provider credentials in M4.21 operational artifacts
        run: >-
          ! git grep -nEi
          '(setfacl[[:space:]]+(-R|--recursive)|systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]|WantedBy=|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN|[[:space:]]trust([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_path_access.sh
          config/postgresql/adult-publishing-commercial-s0.pg_hba.rule
          config/postgresql/adult-publishing-commercial-s0.pg_ident.map
      - name: Validate M4.22 commercial installation authorization JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-installation-authorization.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-installation-authorization.m4-22.json >/dev/null
      - name: Compile M4.22 commercial installation authorization artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_installation_authorization_gate.py
          tests/test_adult_commercial_installation_authorization.py
      - name: Run M4.22 commercial installation authorization tests
        run: python3 -m unittest -v tests.test_adult_commercial_installation_authorization
      - name: Reject mutation and network behavior in M4.22 authorization gate
        run: >-
          ! git grep -nEi
          '(systemctl|service[[:space:]]+(start|stop|restart|enable|disable)|docker[[:space:]]|ssh[[:space:]]|tailscale[[:space:]]|subprocess|https?://|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_installation_authorization_gate.py
      - name: Validate M4.23 stopped installation shell
        run: bash -n scripts/tu1nz_adult_commercial_s0_install.sh
      - name: Compile M4.23 stopped installation tests
        run: python3 -m py_compile tests/test_adult_commercial_s0_stopped_installation.py
      - name: Run M4.23 stopped installation tests
        run: python3 -m unittest -v tests.test_adult_commercial_s0_stopped_installation
      - name: Reject first start, enablement, cron and provider credentials in M4.23
        run: >-
          ! git grep -nEi
          '(systemctl[[:space:]]+(start|restart|enable)[[:space:]]+.*commercial|WantedBy=|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_s0_install.sh
          config/adult-publishing/staging-s0-commercial/bootstrap.sql
          config/adult-publishing/staging-s0-commercial/core-identities.synthetic.json
          config/adult-publishing/staging-s0-commercial/state.empty.json
      - name: Validate M4.24 network-free first-start JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-first-start.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-first-start.m4-24.json >/dev/null
      - name: Compile M4.24 first-start artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_first_start_gate.py
          scripts/tu1nz_adult_commercial_s0_first_start.py
          tests/test_adult_commercial_first_start.py
      - name: Run M4.24 first-start tests
        run: python3 -m unittest -v tests.test_adult_commercial_first_start
      - name: Require committed M4.24 contract to remain NO-GO
        run: >-
          scripts/tu1nz_adult_commercial_first_start_gate.py
          --contract manifests/adult-publishing-commercial-first-start.m4-24.json
          && ! scripts/tu1nz_adult_commercial_first_start_gate.py
          --contract manifests/adult-publishing-commercial-first-start.m4-24.json
          --require-approved
      - name: Reject enablement, restart, deletion, networking and provider credentials in M4.24
        shell: bash
        run: |
          if git grep -nEi \
            '(SYSTEMCTL,[[:space:]]*"(enable|restart)"|rm[[:space:]]+-rf|shutil\.rmtree|docker[[:space:]]+run|https?://api\.|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN|(^|[[:space:]])crontab([[:space:]]|$))' -- \
            scripts/tu1nz_adult_commercial_first_start_gate.py \
            scripts/tu1nz_adult_commercial_s0_first_start.py
          then
            echo "Forbidden M4.24 behavior detected" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "M4.24 static guard infrastructure failed" >&2
              exit "$status"
            fi
          fi
      - name: Validate M4.25 stopped unit refresh shell
        run: bash -n scripts/tu1nz_adult_commercial_s0_unit_refresh.sh
      - name: Validate M4.25 systemd unit
        shell: bash
        run: |
          temporary_unit="$(mktemp --suffix=.service)"
          sed 's|^ExecStart=.*$|ExecStart=/bin/true|' \
            systemd/tu1nz-adult-commercial-s0.service >"$temporary_unit"
          systemd-analyze verify "$temporary_unit"
      - name: Compile M4.25 stopped unit refresh tests
        run: python3 -m py_compile tests/test_adult_commercial_s0_unit_refresh.py
      - name: Run M4.25 stopped unit refresh tests
        run: python3 -m unittest -v tests.test_adult_commercial_s0_unit_refresh
      - name: Validate M4.25 stopped unit refresh evidence JSON
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-unit-refresh.schema.json >/dev/null
          && python3 -m json.tool
          manifests/adult-publishing-commercial-unit-refresh.m4-25.json >/dev/null
      - name: Reject candidate activation, cron and provider credentials in M4.25 controller
        run: >-
          ! git grep -nEi
          '(systemctl[[:space:]]+(start|restart|enable)[[:space:]]+.*commercial|(^|[[:space:]])crontab([[:space:]]|$)|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_s0_unit_refresh.sh
      - name: Require exact restart, runtime and static M4.25 unit boundary
        shell: bash
        run: |
          unit=systemd/tu1nz-adult-commercial-s0.service
          test "$(grep -c '^Restart=' "$unit")" -eq 1
          grep -qx 'Restart=no' "$unit"
          test "$(grep -c '^RuntimeMaxSec=' "$unit")" -eq 1
          grep -qx 'RuntimeMaxSec=180' "$unit"
          if grep -nE '^(RestartSec=|OnFailure=|WantedBy=|\[Install\])' "$unit"
          then
            echo "Forbidden M4.25 restart or activation directive detected" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "M4.25 unit boundary guard infrastructure failed" >&2
              exit "$status"
            fi
          fi
      - name: Compile M4.26 read-only first-start gate and tests
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_m4_26_gate.py
          tests/test_adult_commercial_m4_26.py
      - name: Run M4.26 read-only first-start tests
        run: python3 -m unittest -v tests.test_adult_commercial_m4_26
      - name: Validate M4.26 evidence JSON and closed approval gate
        shell: bash
        run: |
          python3 -m json.tool \
            manifests/adult-publishing-commercial-first-start.m4-26.schema.json >/dev/null
          python3 -m json.tool \
            manifests/adult-publishing-commercial-first-start.m4-26.json >/dev/null
          scripts/tu1nz_adult_commercial_m4_26_gate.py \
            --contract manifests/adult-publishing-commercial-first-start.m4-26.json
          if scripts/tu1nz_adult_commercial_m4_26_gate.py \
            --contract manifests/adult-publishing-commercial-first-start.m4-26.json \
            --require-approved
          then
            echo "M4.26 unexpectedly authorized first start" >&2
            exit 1
          fi
      - name: Reject mutation and provider surfaces in M4.26 gate
        run: >-
          ! git grep -nEi
          '(subprocess|systemctl|docker|requests|urllib|socket|write_text|write_bytes|unlink\(|rmtree|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_m4_26_gate.py
      - name: Compile M4.27 preparation gate and tests
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_m4_27_gate.py
          tests/test_adult_commercial_m4_27.py
      - name: Run M4.27 preparation tests
        run: python3 -m unittest -v tests.test_adult_commercial_m4_27
      - name: Validate M4.27 draft JSON and closed readiness gates
        shell: bash
        run: |
          contract=manifests/adult-publishing-commercial-first-start-authorization-preparation.m4-27.json
          python3 -m json.tool \
            manifests/adult-publishing-commercial-first-start-authorization-preparation.m4-27.schema.json >/dev/null
          python3 -m json.tool "$contract" >/dev/null
          scripts/tu1nz_adult_commercial_m4_27_gate.py --contract "$contract"
          for readiness in --require-sync-ready --require-prestart-ready --require-authorization-ready
          do
            if scripts/tu1nz_adult_commercial_m4_27_gate.py \
              --contract "$contract" "$readiness"
            then
              echo "M4.27 unexpectedly opened readiness gate: $readiness" >&2
              exit 1
            fi
          done
      - name: Reject system, network, write and provider surfaces in M4.27 gate
        run: >-
          ! git grep -nEi
          '(subprocess|systemctl|daemon-reload|docker[.(]|(import|from)[[:space:]]+docker|requests|urllib|socket|write_text|write_bytes|unlink\(|rmtree|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_m4_27_gate.py
      - name: Compile M4.28 sync authorization gate and tests
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_m4_28_gate.py
          tests/test_adult_commercial_m4_28.py
      - name: Run M4.28 sync authorization tests
        run: python3 -m unittest -v tests.test_adult_commercial_m4_28
      - name: Validate M4.28 JSON and closed authorization gates
        shell: bash
        run: |
          contract=manifests/adult-publishing-commercial-canonical-sync-authorization.m4-28.json
          python3 -m json.tool \
            manifests/adult-publishing-commercial-canonical-sync-authorization.m4-28.schema.json >/dev/null
          python3 -m json.tool "$contract" >/dev/null
          scripts/tu1nz_adult_commercial_m4_28_gate.py --contract "$contract"
          for readiness in --require-authorization-ready --require-mutation-ready
          do
            if scripts/tu1nz_adult_commercial_m4_28_gate.py \
              --contract "$contract" "$readiness"
            then
              echo "M4.28 unexpectedly opened readiness gate: $readiness" >&2
              exit 1
            fi
          done
      - name: Reject host, network, write and provider surfaces in M4.28 gate
        run: >-
          ! git grep -nEi
          '(subprocess|systemctl|daemon-reload|paramiko|(^|[^[:alnum:]_])ssh([^[:alnum:]_]|$)|requests|urllib|socket|os\.system|shutil|write_text|write_bytes|unlink\(|rmtree|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_m4_28_gate.py
      - name: Compile M4.29 post-merge sync gate and tests
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_m4_29_gate.py
          tests/test_adult_commercial_m4_29.py
      - name: Run M4.29 post-merge sync tests
        run: python3 -m unittest -v tests.test_adult_commercial_m4_29
      - name: Validate M4.29 JSON and all closed gates
        shell: bash
        run: |
          contract=manifests/adult-publishing-commercial-post-merge-sync-authorization.m4-29.json
          python3 -m json.tool \
            manifests/adult-publishing-commercial-post-merge-sync-authorization.m4-29.schema.json >/dev/null
          python3 -m json.tool "$contract" >/dev/null
          scripts/tu1nz_adult_commercial_m4_29_gate.py --contract "$contract"
          for readiness in --require-server-contact-ready --require-sync-authorization-ready --require-mutation-ready
          do
            if scripts/tu1nz_adult_commercial_m4_29_gate.py \
              --contract "$contract" "$readiness"
            then
              echo "M4.29 unexpectedly opened readiness gate: $readiness" >&2
              exit 1
            fi
          done
      - name: Reject host, network, write and provider surfaces in M4.29 gate
        run: >-
          ! git grep -nEi
          '(subprocess|systemctl|daemon-reload|paramiko|(^|[^[:alnum:]_])ssh([^[:alnum:]_]|$)|requests|urllib|socket|os\.system|shutil|write_text|write_bytes|unlink\(|rmtree|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN)' --
          scripts/tu1nz_adult_commercial_m4_29_gate.py
      - name: Validate M4.29.2 Agentmode maintenance shell
        run: >-
          bash -n
          scripts/tu1nz_sync_all.sh
          scripts/tu1nz_agent_health.sh
          scripts/tu1nz_require_sync.sh
          scripts/tu1nz_integrity_consolidation.sh
          scripts/tu1nz_monitor_wrap.sh
      - name: Validate M4.29.2 hardened units
        shell: bash
        run: |
          for source in \
            systemd/tu1nz_agentmode.service \
            systemd/tu1nz_integrity.service \
            systemd/tu1nz_monitor.service
          do
            temporary_unit="$(mktemp --suffix=.service)"
            sed 's|^ExecStart=.*$|ExecStart=/bin/true|' "$source" >"$temporary_unit"
            systemd-analyze verify "$temporary_unit"
          done
      - name: Compile and run M4.29.2 maintenance contract
        run: >-
          python3 -m py_compile
          scripts/tu1nz_agentmode_maintenance_gate.py
          tests/test_m4_29_2_agentmode_maintenance.py
          && python3 -m unittest -v tests.test_m4_29_2_agentmode_maintenance
      - name: Validate M4.29.2 JSON and bound artifact hashes
        run: >-
          python3 -m json.tool manifests/tu1nz-agentmode-maintenance.m4-29-2.schema.json >/dev/null
          && python3 -m json.tool manifests/tu1nz-agentmode-maintenance.m4-29-2.json >/dev/null
          && scripts/tu1nz_agentmode_maintenance_gate.py
      - name: Reject automatic Control mutation and Adult Candidate activation in M4.29.2
        shell: bash
        run: |
          if grep -nE '"\$CONTROL_DIR"[[:space:]]+(fetch|pull|merge|reset|checkout|clean)' \
            scripts/tu1nz_sync_all.sh
          then
            echo "Automatic Control mutator detected" >&2
            exit 1
          fi
          if git grep -nEi \
            '(systemctl[[:space:]]+(start|restart|enable)[[:space:]]+.*tu1nz-adult-commercial|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN|(^|[[:space:]])crontab([[:space:]]|$))' -- \
            scripts/tu1nz_sync_all.sh \
            scripts/tu1nz_agent_health.sh \
            scripts/tu1nz_require_sync.sh \
            scripts/tu1nz_integrity_consolidation.sh \
            scripts/tu1nz_monitor_wrap.sh \
            systemd/tu1nz_agentmode.service \
            systemd/tu1nz_integrity.service \
            systemd/tu1nz_monitor.service
          then
            echo "Forbidden M4.29.2 surface detected" >&2
            exit 1
          fi
          grep -qx 'ReadOnlyPaths=/opt/tu1nz_repos/control' systemd/tu1nz_agentmode.service
          grep -qx 'ReadOnlyPaths=/opt/tu1nz_repos/control /opt/tu1nz_repos/docs' systemd/tu1nz_integrity.service
          grep -qx 'ReadOnlyPaths=/opt/tu1nz_repos/control' systemd/tu1nz_monitor.service
      - name: Compile and test final first-start readiness artifacts
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_final_first_start_gate.py
          scripts/tu1nz_adult_commercial_final_first_start_contract.py
          scripts/tu1nz_adult_commercial_final_prestart.py
          scripts/tu1nz_adult_commercial_s0_first_start_final.py
          tests/test_adult_commercial_final_first_start.py
          && python3 -m unittest -v tests.test_adult_commercial_final_first_start
      - name: Validate final first-start authorization schema
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-final-first-start-authorization.schema.json
          >/dev/null
      - name: Reject direct activation, networking and provider credentials in final preparation
        run: >-
          ! git grep -nEi
          '(SYSTEMCTL,[[:space:]]*"(start|restart|enable)"|https?://api\.|TELEGRAM_TOKEN|X_TOKEN|REDDIT_TOKEN|PAYMENT_TOKEN|AVS_TOKEN|(^|[[:space:]])crontab([[:space:]]|$))' --
          scripts/tu1nz_adult_commercial_final_first_start_gate.py
          scripts/tu1nz_adult_commercial_final_first_start_contract.py
          scripts/tu1nz_adult_commercial_final_prestart.py
          scripts/tu1nz_adult_commercial_s0_first_start_final.py
      - name: Compile and test Commercial S3 server-staging Control SSOT
        run: >-
          python3 -m py_compile
          scripts/tu1nz_adult_commercial_s3_control_gate.py
          tests/test_adult_commercial_s3_server_staging_control.py
          && python3 -m unittest -v
          tests.test_adult_commercial_s3_server_staging_control
      - name: Validate Commercial S3 server-staging manifest and gate
        run: >-
          python3 -m json.tool
          manifests/adult-publishing-commercial-s3-server-staging.json >/dev/null
          && scripts/tu1nz_adult_commercial_s3_control_gate.py
      - name: Validate Commercial S3 static bounded unit
        shell: bash
        run: |
          unit=systemd/tu1nz-adult-commercial-s3.service
          temporary_unit="$(mktemp --suffix=.service)"
          sed 's|^ExecStart=.*$|ExecStart=/bin/true|' "$unit" >"$temporary_unit"
          systemd-analyze verify "$temporary_unit"
          ! grep -qx '\[Install\]' "$unit"
          ! grep -q '^WantedBy=' "$unit"

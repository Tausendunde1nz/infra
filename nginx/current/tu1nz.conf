# TU1NZ v1 - static site + clean urls (imprint/privacy)
# SSOT: /var/www/tu1nz

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tu1nz.com www.tu1nz.com;

    return 301 https://$host$request_uri;
}

# HTTPS site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu1nz.com www.tu1nz.com;

    root /var/www/tu1nz;
    index index.html;

    # Clean URLs
    location = /privacy  { try_files /privacy.html  =404; }
    location = /imprint  { try_files /imprint.html  =404; }

    # Default: serve static + fallback to index.html (optional SPA-friendly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- SSL (managed by Certbot / Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/tu1nz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu1nz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

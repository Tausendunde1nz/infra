# HTTP -> HTTPS Redirect (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name n8n.mychatbuddy.dev;
    return 301 https://$host$request_uri;
}

# HTTPS vHost (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n.mychatbuddy.dev;

    ssl_certificate     /etc/letsencrypt/live/n8n.mychatbuddy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.mychatbuddy.dev/privkey.pem;

    access_log /var/log/nginx/n8n_access.log;
    error_log  /var/log/nginx/n8n_error.log;

    location / {
        proxy_pass http://127.0.0.1:5678/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

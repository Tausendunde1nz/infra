upstream wantmeseen_public_sfw {
    server 127.0.0.1:18110 max_fails=1 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wantmeseen.com www.wantmeseen.com wantmeseen.de www.wantmeseen.de;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://wantmeseen.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wantmeseen.de www.wantmeseen.de;
    ssl_certificate /etc/letsencrypt/live/wantmeseen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wantmeseen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://wantmeseen.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wantmeseen.com www.wantmeseen.com;
    ssl_certificate /etc/letsencrypt/live/wantmeseen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wantmeseen.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 32k;

    location = /avs/sandbox/callback {
        if ($request_method != POST) { return 405; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://wantmeseen_public_sfw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header X-Frame-Options DENY always;
    }
}

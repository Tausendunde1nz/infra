# TU1NZ v1 - static site + clean urls (imprint/privacy)
# SSOT: /var/www/tu1nz

# Commercial S8 uses a separately supervised SFW landing candidate. The
# continuously running S7 listener remains the automatic public fallback.
upstream tu1nz_adult_public {
    server 127.0.0.1:8096 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8095 backup;
    keepalive 8;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tu1nz.com www.tu1nz.com;

    return 301 https://$host$request_uri;
}

# HTTPS site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu1nz.com www.tu1nz.com;

    root /var/www/tu1nz;
    index index.html;

    # Clean URLs
    location = /privacy  { try_files /privacy.html  =404; }
    location = /imprint  { try_files /imprint.html  =404; }

    # Origin-level crawler discovery. Keep these at the canonical host root so
    # crawlers do not fall through to the legacy SPA document.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tu1nz.com/sitemap.xml\n";
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=300" always;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://tu1nz.com/</loc></url><url><loc>https://tu1nz.com/adult/</loc></url><url><loc>https://tu1nz.com/adult/privacy</loc></url><url><loc>https://tu1nz.com/adult/terms</loc></url></urlset>';
    }

    # S8 SFW landing candidate with continuously active S7 fallback.
    location = /adult { return 308 /adult/; }
    location ^~ /adult/ {
        proxy_pass http://tu1nz_adult_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        client_max_body_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header X-Frame-Options DENY always;
    }

    # Default: serve static + fallback to index.html (optional SPA-friendly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- SSL (managed by Certbot / Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/tu1nz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu1nz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

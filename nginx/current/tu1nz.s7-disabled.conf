# TU1NZ v1 - static site + disabled Commercial S7 public path
# SSOT: /var/www/tu1nz

server {
    listen 80;
    listen [::]:80;
    server_name tu1nz.com www.tu1nz.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu1nz.com www.tu1nz.com;

    root /var/www/tu1nz;
    index index.html;

    location = /privacy  { try_files /privacy.html  =404; }
    location = /imprint  { try_files /imprint.html  =404; }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tu1nz.com/sitemap.xml\n";
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=300" always;
        return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>https://tu1nz.com/</loc></url><url><loc>https://tu1nz.com/privacy</loc></url><url><loc>https://tu1nz.com/imprint</loc></url></urlset>';
    }

    location = /adult { return 308 /adult/; }
    location ^~ /adult/ {
        return 503;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/tu1nz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu1nz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
